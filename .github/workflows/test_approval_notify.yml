name: Test Approval Notification & Save State

on:
  workflow_dispatch:
    inputs:
      category:
        description: "Category ID (Default: 187)"
        required: false
        default: "187"

permissions:
  contents: write

jobs:
  test-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Test Approval Notification
        env:
          MYOFFICE_USER: ${{ secrets.MYOFFICE_USER }}
          MYOFFICE_PASS: ${{ secrets.MYOFFICE_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MYOFFICE_APPROVAL_CATEGORY: ${{ github.event.inputs.category || '187' }}
          TEST_APPROVAL_MODE: "true"
        run: |
          python test_approval.py

      - name: Commit and push updated approval_state.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add approval_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: test approval notify & store message_id state" && git push)
