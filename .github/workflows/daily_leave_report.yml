name: Daily Leave Report

on:
  schedule:
    # 17:05 UTC = 00:05 Asia/Bangkok (UTC+7), every day.
    - cron: '5 17 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send-daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Send today's leave report
        env:
          MYOFFICE_USER: ${{ secrets.MYOFFICE_USER }}
          MYOFFICE_PASS: ${{ secrets.MYOFFICE_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MYOFFICE_LEAVE_CATEGORY: '187'
          DAILY_LEAVE_REPORT: 'true'
        run: python check_leave.py

      - name: Commit report state
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add leave_state.json
          git diff --quiet && echo 'No state changes' || (git commit -m "Record daily leave report" && git push)
