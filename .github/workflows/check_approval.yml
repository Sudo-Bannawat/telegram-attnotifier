name: CheckApproval

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes, same cadence as CheckLeave
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: checkapproval
  cancel-in-progress: false

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run script
        env:
          MYOFFICE_USER: ${{ secrets.MYOFFICE_USER }}
          MYOFFICE_PASS: ${{ secrets.MYOFFICE_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MYOFFICE_APPROVAL_CATEGORY: "187"
          # Set to "true" in a one-off workflow_dispatch to re-announce all pending
          RESET_APPROVAL_STATE: ${{ vars.RESET_APPROVAL_STATE || 'false' }}
        run: |
          python check_approval.py

      - name: Commit state if changed
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add approval_state.json
          git diff --cached --quiet && echo 'No changes' || (git commit -m "Update approval state" && git push)
