name: Check Approval Requests Notification

on:
  schedule:
    # รันอัตโนมัติทุก 15 นาที
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      reset_approval_state:
        description: 'Reset state and re-announce pending approvals (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  check-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Approval Monitor
        env:
          MYOFFICE_USER: ${{ secrets.MYOFFICE_USER }}
          MYOFFICE_PASS: ${{ secrets.MYOFFICE_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MYOFFICE_APPROVAL_CATEGORY: '187'
          RESET_APPROVAL_STATE: ${{ github.event.inputs.reset_approval_state || 'false' }}
          LINK_SECRET: ${{ secrets.LINK_SECRET }}
          DOC_PROXY_URL: ${{ secrets.DOC_PROXY_URL }}
        run: |
          python check_approval.py

      - name: Commit and push updated approval_state.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add approval_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update approval_state.json [skip ci]" && git push)
